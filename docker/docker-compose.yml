# The local apparatus of the git-law federation simulation.
#
# Works with `docker compose` and with podman (via podman-compose, or
# `docker compose` pointed at the podman socket). Secrets come from ../.env
# (copy ../.env.example). Persistent data lives in ../.state/*.
#
# The compose project name ("polis") prefixes containers: polis-gogs-1 etc.
# The network is named gogs-local to stay compatible with the polis CLI
# defaults and the earlier hand-run containers.
name: polis

networks:
  gogs-local:
    name: gogs-local

services:
  postgres:
    build: ./postgres
    container_name: postgres-gogs
    networks: [gogs-local]
    volumes:
      - ../.state/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gogs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gogs
    restart: unless-stopped

  gogs:
    build: ./gogs
    container_name: gogs
    networks: [gogs-local]
    ports:
      - "10022:2222"   # ssh (git transport only; HTTP goes through the proxy)
    volumes:
      - ../.state/gogs:/data
    restart: unless-stopped

  gitea:
    build: ./gitea
    container_name: gitea
    networks: [gogs-local]
    extra_hosts:
      - host.containers.internal:host-gateway
    ports:
      - "2222:22"      # ssh (git transport only; HTTP goes through the proxy)
    volumes:
      - ../.state/gitea:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres-gogs:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gogs
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__ALLOWED_HOST_LIST: host.containers.internal,localhost
      GITEA__webhook__ALLOW_LOCALNETWORK_HOSTS: "true"
      GITEA__server__DOMAIN: host.containers.internal
      GITEA__server__ROOT_URL: http://host.containers.internal:10800/gitea/
    # The admin account is bootstrapped headlessly by scripts/infra/gitea.sh
    # (the compose stack alone leaves an admin-less gitea).
    depends_on: [postgres]
    restart: unless-stopped

  proxy:
    build: ./caddy
    container_name: proxy
    networks: [gogs-local]
    ports:
      - "10800:10800"  # the only HTTP entrypoint (task 0042)
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on: [gogs, gitea]
    restart: unless-stopped

  woodpecker-server:
    build: ./woodpecker
    container_name: woodpecker-server
    networks: [gogs-local]
    extra_hosts:
      - host.containers.internal:host-gateway
    volumes:
      - ../.state/woodpecker/server:/var/lib/woodpecker
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_HOST: http://host.containers.internal:10800/ci
      WOODPECKER_AGENT_SECRET: w00000d
      WOODPECKER_ADMIN: ${GITEA_ADMIN_USERNAME:-operator}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://host.containers.internal:10800/gitea
      WOODPECKER_DEV_GITEA_OAUTH_URL: http://host.containers.internal:10800/gitea
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: http://host.containers.internal:10800/gitea
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET}
    depends_on: [gitea]
    restart: unless-stopped

  woodpecker-agent:
    build: ./woodpecker-agent
    container_name: woodpecker-agent
    networks: [gogs-local]
    # the runtime quirks (podman-machine's root mapping + SELinux label; the
    # engine socket path) come from the environment — scripts/infra/env.sh
    # exports POLIS_CONTAINER_SOCKET for the detected runtime (task 0043).
    # podman-machine users run compose via compose-up.sh (which sources it);
    # docker users get the defaults.
    user: "${POLIS_AGENT_USER:-0:0}"
    security_opt:
      - ${POLIS_AGENT_SECURITY_OPT:-label=disable}
    extra_hosts:
      - host.containers.internal:host-gateway
    volumes:
      - ../.state/woodpecker/agent/01:/etc/woodpecker
      - ${POLIS_CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: w00000d
      WOODPECKER_BACKEND_DOCKER_NETWORK: gogs-local
    depends_on: [woodpecker-server]
    restart: unless-stopped
