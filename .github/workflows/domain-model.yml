name: domain-model tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # the whole domain: container-free checks plus the cross-jurisdiction
      # story suite on a shared sim (task 0068; docker is the runner's)
      - name: domain-model domain
        run: uv run behave features/ --tags @domain
