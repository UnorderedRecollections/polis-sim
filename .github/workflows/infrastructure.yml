name: infrastructure tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: infrastructure domain
        run: uv run behave features/ --tags @infrastructure
      - name: container diagnostics (on failure)
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '^(bdd-|fail-|polis-operator-bdd)' || true); do
            echo "===== logs: $c"
            docker logs --tail 80 "$c" 2>&1 || true
          done
