name: infrastructure tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: infrastructure domain
        run: uv run behave features/ --tags @infrastructure
      - name: container diagnostics (on failure)
        if: failure()
        run: |
          uv run python -c "from polis.clients import containers; print('runtime:', containers.runtime_name())" || true
          uv run polis provision status bdd-infra || true
          ss -ltnp | grep -E ':(11880)\b' || true
          for rt in docker podman; do
            command -v "$rt" >/dev/null 2>&1 || continue
            echo "===== $rt ps -a"
            "$rt" ps -a || true
            for c in $("$rt" ps -a --format '{{.Names}}' | grep -E '^(bdd-|fail-|polis-operator-bdd)' || true); do
              echo "===== logs ($rt): $c"
              "$rt" logs --tail 80 "$c" 2>&1 || true
            done
          done
