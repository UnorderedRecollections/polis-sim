name: functional tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # the container-free command surface; the sim-backed component
      # suites (gogs, gitea, citynode, health, woodpecker) are
      # @slow @containers and stay opt-in (task 0069)
      - name: functional domain
        run: uv run behave features/ --tags "@functional and not @slow"
