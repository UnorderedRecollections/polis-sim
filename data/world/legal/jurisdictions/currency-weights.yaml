jurisdiction: currency-weights
name: Currency & Weights
corpus_dir: null
paradigms: [conduct-status]   # see ontology/paradigms.yaml

resources:
  - the_mint
  - exchange_office
  - standard_bushel

actors:
  - treasurer
  - money_changer
  - assayer

activities:
  - verb: mint
    actors: [treasurer]
    target: norm
    affects: [fineness, seigniorage]
    impact: requires
  - verb: exchange
    actors: [money_changer]
    target: object
    affects: [exchange_rate]
    impact: enriches
  - verb: assay
    actors: [assayer]
    target: object
    affects: [fineness]
    impact: requires
  - verb: clip
    actors: [money_changer]
    target: object
    affects: [fineness]
    impact: penalizes

resource_properties:
  - fineness
  - denomination
  - exchange_rate
  - seigniorage

rule_forms:
  - fixed_standard
  - free_coinage
  - debasement_prohibition
  - legal_tender
  - exchange_office

disputes:
  - clipped_coin
  - debasement
  - exchange_rates
  - false_weights
