jurisdiction: inheritance
name: Inheritance
corpus_dir: succession
paradigms: [resource]   # see ontology/paradigms.yaml

resources:
  - the_probate_rolls
  - family_seats
  - entailments

actors:
  - heir
  - testator
  - probate_judge

activities:
  - verb: bequeath
    actors: [testator]
    target: object
    affects: [will, share]
    impact: enriches
  - verb: inherit
    actors: [heir]
    target: resource
    affects: [share]
    impact: occupies
  - verb: contest_will
    actors: [heir]
    target: object
    affects: [will, legitim]
    impact: blocks
  - verb: partition
    actors: [heir, probate_judge]
    target: resource
    affects: [share]
    impact: depletes

resource_properties:
  - share
  - legitim
  - will
  - debts

rule_forms:
  - primogeniture
  - partible_inheritance
  - testamentary_freedom
  - forced_share
  - escheat_to_city

disputes:
  - contested_wills
  - disinherited_heirs
  - cross_city_succession
  - escheats

incompatibilities:
  - between: [primogeniture, partible_inheritance]
    over: share
    kind: strict
    note: one heir or all heirs, not both
  - between: [testamentary_freedom, forced_share]
    over: legitim
    kind: strict
    note: freedom to disinherit against a forced portion
  - between: [primogeniture, forced_share]
    over: share
    kind: tension
    note: the eldest takes the seat, the rest must take something
