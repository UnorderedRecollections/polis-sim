jurisdiction: roads-carriage
name: Roads & Carriage
corpus_dir: null
paradigms: [resource]   # see ontology/paradigms.yaml

resources:
  - the_causeway
  - chain_bridge
  - toll_gates

actors:
  - carrier
  - toll_farmer
  - road_warden

activities:
  - verb: carry
    actors: [carrier]
    target: resource
    affects: [route]
    impact: occupies
  - verb: collect_toll
    actors: [toll_farmer]
    target: norm
    affects: [toll_rate]
    impact: blocks
  - verb: repair
    actors: [road_warden]
    target: resource
    affects: [maintenance_duty]
    impact: enriches
  - verb: weigh_loads
    actors: [toll_farmer, road_warden]
    target: resource
    affects: [toll_rate]
    impact: occupies

resource_properties:
  - route
  - toll_rate
  - maintenance_duty
  - bridge

rule_forms:
  - free_passage
  - toll_by_weight
  - maintenance_corvee
  - bridge_monopoly
  - carrier_license

disputes:
  - toll_disputes
  - broken_bridges
  - unlicensed_carriers
  - corvee_evasion

incompatibilities:
  - between: [free_passage, toll_by_weight]
    over: toll_rate
    kind: strict
    note: a road cannot be free and tolled at once
  - between: [bridge_monopoly, free_passage]
    over: bridge
    kind: tension
    note: a monopoly over what others call free
