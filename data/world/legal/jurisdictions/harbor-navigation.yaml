jurisdiction: harbor-navigation
name: Harbor & Navigation
corpus_dir: maritime
paradigms: [resource]   # see ontology/paradigms.yaml

resources:
  - northern_harbor
  - the_roads
  - pilot_cut

actors:
  - harbor_master
  - merchant
  - shipowner
  - pilot

activities:
  - verb: berth
    actors: [shipowner, merchant]
    target: resource
    affects: [berth]
    impact: occupies
  - verb: load_cargo
    actors: [merchant]
    target: resource
    affects: [berth]
    impact: occupies
  - verb: pilot_in
    actors: [pilot]
    target: resource
    affects: [pilotage]
    impact: enriches
  - verb: levy_dues
    actors: [harbor_master]
    target: norm
    affects: [dues]
    impact: burdens

resource_properties:
  - berth
  - dues
  - right_of_way
  - pilotage

rule_forms:
  - open_port
  - harbor_dues
  - compulsory_pilotage
  - priority_berthing
  - quarantine
  - tonnage_exemption

disputes:
  - dues
  - berthing_priority
  - pilotage
  - quarantine
  - right_of_way
