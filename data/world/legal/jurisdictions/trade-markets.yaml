jurisdiction: trade-markets
name: Trade & Markets
corpus_dir: commerce
paradigms: [resource, conduct-status]   # see ontology/paradigms.yaml

resources:
  - the_great_market
  - weighing_house
  - market_square

actors:
  - merchant
  - guild
  - market_warden

activities:
  - verb: sell
    actors: [merchant]
    target: resource
    affects: [stall]
    impact: occupies
  - verb: weigh
    actors: [market_warden]
    target: resource
    affects: [standard_measure]
    impact: blocks
  - verb: license_stall
    actors: [guild, market_warden]
    target: norm
    affects: [license]
    impact: blocks
  - verb: inspect_goods
    actors: [market_warden]
    target: resource
    affects: [standard_measure]
    impact: blocks

resource_properties:
  - stall
  - tariff_rate
  - standard_measure
  - license

rule_forms:
  - free_entry
  - guild_monopoly
  - tariff_schedule
  - standard_weights
  - market_days

disputes:
  - false_weights
  - foreign_merchants
  - guild_exclusion
  - tariff_evasion
