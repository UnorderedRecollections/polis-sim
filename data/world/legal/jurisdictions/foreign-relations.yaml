jurisdiction: foreign-relations
name: Foreign Relations
corpus_dir: null
paradigms: [political-burden]   # see ontology/paradigms.yaml

resources:
  - the_border_stones
  - treaty_archive
  - crossing_posts

actors:
  - envoy
  - border_warden
  - neighboring_state

activities:
  - verb: negotiate
    actors: [envoy]
    target: norm
    affects: [tariff_regime]
    impact: allocates
  - verb: ratify_treaty
    actors: [envoy]
    target: norm
    affects: [boundary_line]
    impact: obliges
  - verb: patrol_border
    actors: [border_warden]
    target: resource
    affects: [crossing_points]
    impact: obliges
  - verb: extradite
    actors: [border_warden, envoy]
    target: object
    affects: [extradition]
    impact: obliges

resource_properties:
  - boundary_line
  - crossing_points
  - tariff_regime
  - extradition

rule_forms:
  - open_border
  - treaty_boundary
  - most_favored_nation
  - extradition_compact
  - neutral_zone

disputes:
  - border_incidents
  - treaty_interpretation
  - smuggling
  - fugitives

incompatibilities:
  - between: [open_border, treaty_boundary]
    over: boundary_line
    kind: strict
    note: the border is either free or treaty-bound
  - between: [most_favored_nation, neutral_zone]
    over: tariff_regime
    kind: tension
    note: favoring one against favoring none
