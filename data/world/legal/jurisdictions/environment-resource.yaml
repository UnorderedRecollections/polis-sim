jurisdiction: environment-resource
name: Environmental/Resource
corpus_dir: null
paradigms: [resource]   # see ontology/paradigms.yaml

resources:
  - the_great_forest
  - tin_workings
  - peat_moss

actors:
  - extractor
  - forester
  - commons_warden

activities:
  - verb: fell
    actors: [extractor]
    target: resource
    affects: [stock, regeneration]
    impact: depletes
  - verb: dig
    actors: [extractor]
    target: resource
    affects: [stock]
    impact: depletes
  - verb: burn_off
    actors: [extractor, forester]
    target: resource
    affects: [regeneration]
    impact: pollutes
  - verb: replant
    actors: [forester]
    target: resource
    affects: [regeneration]
    impact: enriches

resource_properties:
  - stock
  - regeneration
  - extraction_method
  - season

rule_forms:
  - sustained_yield
  - extraction_lease
  - closed_season
  - commons_management
  - royalty_on_extraction

disputes:
  - over_extraction
  - unlicensed_workings
  - replanting_duties
  - royalty_evasion

incompatibilities:
  - between: [sustained_yield, extraction_lease]
    over: stock
    kind: strict
    note: a lease to take cannot bind to keep
  - between: [closed_season, extraction_lease]
    over: season
    kind: tension
    note: a year-round lease against a closed season
