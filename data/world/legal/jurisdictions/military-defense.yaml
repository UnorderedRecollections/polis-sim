jurisdiction: military-defense
name: Military/Defense
corpus_dir: null
paradigms: [political-burden]   # see ontology/paradigms.yaml

resources:
  - the_watch_towers
  - muster_rolls
  - city_walls

actors:
  - captain
  - levy_master
  - city_marshal

activities:
  - verb: muster
    actors: [levy_master, city_marshal]
    target: resource
    affects: [contingent_size]
    impact: obliges
  - verb: garrison
    actors: [captain]
    target: resource
    affects: [cost_share]
    impact: burdens
  - verb: drill
    actors: [captain]
    target: resource
    affects: [contingent_size]
    impact: burdens
  - verb: fortify
    actors: [city_marshal]
    target: resource
    affects: [fortification, cost_share]
    impact: allocates

resource_properties:
  - contingent_size
  - fortification
  - cost_share
  - command

rule_forms:
  - levy_by_population
  - levy_by_wealth
  - federal_command
  - city_command
  - substitution_by_payment

disputes:
  - unpaid_levies
  - command_disputes
  - unequal_burdens
  - mercenary_contracts

incompatibilities:
  - between: [levy_by_population, levy_by_wealth]
    over: cost_share
    kind: strict
    note: count heads or count purses, not both
  - between: [federal_command, city_command]
    over: command
    kind: strict
    note: one army, one commander
  - between: [substitution_by_payment, levy_by_population]
    over: contingent_size
    kind: tension
    note: buying out of what is counted in heads
