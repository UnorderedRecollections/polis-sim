jurisdiction: contract
name: Contract Law
corpus_dir: null
paradigms: [conduct-status]   # see ontology/paradigms.yaml

resources:
  - the_bond_rolls
  - merchants_court
  - surety_house

actors:
  - creditor
  - debtor
  - surety

activities:
  - verb: lend
    actors: [creditor]
    target: object
    affects: [sum, term]
    impact: enriches
  - verb: sell_on_credit
    actors: [merchant, creditor]
    target: object
    affects: [sum]
    impact: enriches
  - verb: stand_surety
    actors: [surety]
    target: object
    affects: [security]
    impact: burdens
  - verb: enforce_bond
    actors: [creditor]
    target: object
    affects: [rate, security]
    impact: penalizes

resource_properties:
  - sum
  - term
  - security
  - form

rule_forms:
  - written_form_required
  - usury_cap
  - specific_performance
  - debtor_prison_abolished
  - guild_arbitration

disputes:
  - unpaid_debts
  - usury
  - broken_partnerships
  - contested_bonds
