jurisdiction: taxation
name: Taxation
corpus_dir: taxation
paradigms: [conduct-status]   # see ontology/paradigms.yaml

resources:
  - customs_house
  - the_levy_rolls
  - exemption_charters

actors:
  - treasurer
  - tax_farmer
  - merchant

activities:
  - verb: levy
    actors: [treasurer]
    target: norm
    affects: [rate, base]
    impact: burdens
  - verb: collect
    actors: [tax_farmer]
    target: object
    affects: [point_of_collection]
    impact: burdens
  - verb: assess
    actors: [treasurer, tax_farmer]
    target: object
    affects: [base]
    impact: penalizes
  - verb: exempt
    actors: [treasurer]
    target: norm
    affects: [exemption]
    impact: confers-status

resource_properties:
  - rate
  - base
  - exemption
  - point_of_collection

rule_forms:
  - uniform_levy
  - ad_valorem
  - exemption_charter
  - farm_out_collection
  - retaliatory_tariff

disputes:
  - evasion
  - exemption_abuse
  - retaliatory_tariffs
  - collection_point

incompatibilities:
  - between: [uniform_levy, retaliatory_tariff]
    over: rate
    kind: strict
    note: one rate for all against rates aimed at one
  - between: [uniform_levy, exemption_charter]
    over: exemption
    kind: tension
    note: exemptions pierce uniformity but are granted
