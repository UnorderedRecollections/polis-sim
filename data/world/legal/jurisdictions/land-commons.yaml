jurisdiction: land-commons
name: Land & Commons
corpus_dir: null
paradigms: [resource]   # see ontology/paradigms.yaml

resources:
  - western_commons
  - old_forest
  - stubble_fields

actors:
  - farmer
  - shepherd
  - village_reeve

activities:
  - verb: graze
    actors: [farmer, shepherd]
    target: resource
    affects: [grazing_capacity]
    impact: depletes
  - verb: gather_wood
    actors: [farmer]
    target: resource
    affects: [stock]
    impact: depletes
  - verb: enclose
    actors: [village_reeve, farmer]
    target: resource
    affects: [enclosure, tenure]
    impact: blocks
  - verb: plough
    actors: [farmer]
    target: resource
    affects: [parcel]
    impact: occupies

resource_properties:
  - parcel
  - grazing_capacity
  - enclosure
  - tenure

rule_forms:
  - open_commons
  - stinting
  - enclosure_grant
  - customary_tenure
  - forest_reserve

disputes:
  - overgrazing
  - enclosure
  - wood_gathering
  - boundary

incompatibilities:
  - between: [open_commons, enclosure_grant]
    over: enclosure
    kind: strict
    note: enclosure ends the commons
  - between: [stinting, open_commons]
    over: grazing_capacity
    kind: tension
    note: stints ration the open field
