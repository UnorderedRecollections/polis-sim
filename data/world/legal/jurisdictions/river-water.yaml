jurisdiction: river-water
name: River & Water
corpus_dir: null
paradigms: [resource]   # see ontology/paradigms.yaml

resources:
  - the_great_weir
  - irrigation_cuts
  - headwaters

actors:
  - farmer
  - miller
  - city_waterwarden

activities:
  - verb: divert
    actors: [farmer, miller]
    target: resource
    affects: [flow]
    impact: depletes
    direction: upstream
  - verb: irrigate
    actors: [farmer]
    target: resource
    affects: [flow, quality]
    impact: depletes
    direction: downstream
  - verb: mill
    actors: [miller]
    target: resource
    affects: [flow]
    impact: occupies
  - verb: dam
    actors: [city_waterwarden]
    target: resource
    affects: [flow]
    impact: blocks
    direction: upstream

resource_properties:
  - flow
  - diversion_point
  - season
  - quality

rule_forms:
  - prior_appropriation
  - riparian_sharing
  - minimum_flow
  - diversion_permit
  - pollution_prohibition

disputes:
  - upstream_diversion
  - drought_sharing
  - pollution
  - mill_rights

incompatibilities:
  - between: [prior_appropriation, riparian_sharing]
    over: flow
    kind: strict
    note: first-in-time and share-alike cannot both allocate flow
  - between: [minimum_flow, diversion_permit]
    over: flow
    kind: tension
    note: permits eat at the guaranteed flow
