jurisdiction: citizenship
name: Citizenship
corpus_dir: civic
paradigms: [conduct-status]   # see ontology/paradigms.yaml

resources:
  - the_freedom_rolls
  - guest_registers

actors:
  - citizen
  - newcomer
  - city_clerk

activities:
  - verb: reside
    actors: [newcomer]
    target: object
    affects: [residence_duration]
    impact: requires
  - verb: swear_oath
    actors: [newcomer]
    target: object
    affects: [oath]
    impact: confers-status
  - verb: enroll
    actors: [city_clerk]
    target: norm
    affects: [oath, residence_duration]
    impact: confers-status
  - verb: sponsor
    actors: [citizen]
    target: object
    affects: [residence_duration]
    impact: confers-status

resource_properties:
  - residence_duration
  - property
  - oath
  - parentage

rule_forms:
  - jus_soli
  - jus_sanguinis
  - naturalization_by_residence
  - freedom_by_purchase
  - guest_status

disputes:
  - contested_freedom
  - newcomers_rights
  - dual_allegiance
  - expulsion

incompatibilities:
  - between: [naturalization_by_residence, guest_status]
    over: residence_duration
    kind: strict
    note: residence either earns the freedom or keeps the guest
  - between: [jus_soli, jus_sanguinis]
    over: parentage
    kind: tension
    note: soil and blood both claim the newborn
