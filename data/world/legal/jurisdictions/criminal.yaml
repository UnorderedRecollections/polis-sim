jurisdiction: criminal
name: Criminal Law
corpus_dir: criminal
paradigms: [conduct-status]   # see ontology/paradigms.yaml

resources:
  - the_high_tribunal
  - city_watch
  - the_assize_rolls

actors:
  - magistrate
  - accuser
  - accused

activities:
  - verb: accuse
    actors: [accuser]
    target: object
    affects: [act, venue]
    impact: penalizes
  - verb: arrest
    actors: [magistrate]
    target: object
    affects: [act]
    impact: penalizes
  - verb: try
    actors: [magistrate]
    target: object
    affects: [venue, penalty]
    impact: requires
  - verb: punish
    actors: [magistrate]
    target: object
    affects: [penalty]
    impact: penalizes

resource_properties:
  - act
  - intent
  - penalty
  - venue

rule_forms:
  - city_venue
  - federal_venue
  - proportional_penalty
  - composition_instead_of_punishment
  - outlawry

disputes:
  - competing_venues
  - blood_feuds
  - disproportionate_punishment
  - sanctuary

incompatibilities:
  - between: [city_venue, federal_venue]
    over: venue
    kind: strict
    note: an offense has one judge, not two
  - between: [proportional_penalty, composition_instead_of_punishment]
    over: penalty
    kind: tension
    note: pay the debt or pay the price
